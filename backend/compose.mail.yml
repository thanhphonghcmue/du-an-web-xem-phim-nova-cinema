services:
  mailpit:
    image: axllent/mailpit:v1.27@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "500"
      MP_DISABLE_VERSION_CHECK: "true"
    ports:
      - "127.0.0.1:${SMTP_LOCAL_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_LOCAL_HTTP_PORT:-8025}:8025"
    volumes:
      - mailpit_data:/data
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  mailpit_data:
