name: nova-cinema-phase1
services:
  postgres:
    image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    environment:
      POSTGRES_USER: nova_owner
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:?Run npm run db:configure first}
      POSTGRES_DB: nova_development
      TZ: UTC
    ports:
      - "127.0.0.1:${DATABASE_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova_owner -d nova_development"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  postgres-test:
    image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    profiles: [test]
    environment:
      POSTGRES_USER: nova_owner
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Run npm run db:configure first}
      POSTGRES_DB: nova_test
      TZ: UTC
    ports:
      - "127.0.0.1:${TEST_DATABASE_PORT:-55433}:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova_owner -d nova_test"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
  postgres_test_data:
